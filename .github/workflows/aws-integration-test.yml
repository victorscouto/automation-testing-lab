name: AWS Integration Tests with MiniStack

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3

      - name: Start MiniStack via Docker Compose
        run: docker compose up -d ministack

      - name: Wait for MiniStack to be ready
        run: |
          echo "Aguardando MiniStack responder na porta 4566..."
          until curl -s http://localhost:4566/_localstack/health | grep -q "running" || nc -z localhost 4566; do
            sleep 1
          done

      - name: Run Integration Tests
        run: |
          pytest tests/
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
